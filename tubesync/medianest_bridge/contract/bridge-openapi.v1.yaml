#   update is description-only: codifies DECISIONS #27 -- the
#   /sources/validate slice-1 scope [SourceForm field-level checks +
#   validate_url() shape cross-check only, no directory-traversal/
#   media-format checks, no network calls] and ValidatedSource.displayName's
#   canonicalKey-echo placeholder -- both already implemented exactly this
#   way since T3. No schema/enum changes; conformance tests are unaffected.)
#
# Vendored into this fork so the bridge app's conformance tests
# (medianest_bridge/tests/test_contract_conformance.py) can validate
# responses against the exact contract version they implement without a
# cross-repository dependency at test time. If the canonical contract
